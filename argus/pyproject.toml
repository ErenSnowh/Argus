[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-soc-agent"
version = "0.1.0"
description = "ARGUS: AI network-attack forecasting + multi-agent SOC co-pilot (SIH 2026 PS 26153) — Temporal Transformer world model, counterfactual simulator, CERT-In/NCIIPC reporting, on a Google ADK + MCP scaffold"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.0",
    "mcp>=1.0",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26",
    "scapy>=2.5",
    "joblib>=1.3",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
argus = "cli.argus_cli:main"

[project.optional-dependencies]
world_model = ["torch>=2.0"]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["agents", "cli", "mcp_server", "ml", "ml.world_model", "security"]
